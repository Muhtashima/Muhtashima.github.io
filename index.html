<!DOCTYPE html>
<html>
<head>
  <title>My App</title>

  <style>
    body {
      font-family: Arial;
      text-align: center;
      padding: 50px;
    }

    .btn {
      background: #4CAF50;
      color: white;
      padding: 15px 25px;
      font-size: 18px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
    }
  </style>

  <script>
    window.onload = function () {

      const pathParts = window.location.pathname.split("/");
      const gameID = pathParts[pathParts.length - 1];

      // Only redirect if valid gameID exists
      if (gameID && gameID !== "" && gameID !== "index.html") {

        const deepLink = `https://muhtashima.github.io/game/${gameID}`;

        // Try opening app via Android App Links
        window.location.href = deepLink;

      }
    };
  </script>
</head>

<body>

  <h1>Download My App 📱</h1>

  <p>If app doesn't open, download APK below:</p>

  <button class="btn"
    onclick="window.location.href='https://github.com/Muhtashima/Muhtashima.github.io/releases/download/v0.6/app-arm64-v8a-release.apk'">
    Download APK
  </button>

  <hr>

  <ul>
    <li><a href="https://github.com/Muhtashima/Muhtashima.github.io/releases/tag/v0.6">v0.6</a></li>
    <li><a href="https://github.com/Muhtashima/Muhtashima.github.io/releases/tag/v0.5">v0.5</a></li>
    <li><a href="https://github.com/Muhtashima/Muhtashima.github.io/releases/tag/v0.4">v0.4</a></li>
  </ul>

</body>
</html>
